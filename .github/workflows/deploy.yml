# Builds the site and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repository's settings on github.com:
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions".
#   2. Settings > Secrets and variables > Actions > New repository secret, named VITE_ESRI_API_KEY,
#      holding the Esri key. Restrict that key to this site's address in Esri's settings, because a
#      key used by a web page is visible to its visitors.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # The site is served from /<repository name>/, so every asset path has to start there.
      - run: npx vite build --base="/${{ github.event.repository.name }}/"
        env:
          VITE_ESRI_API_KEY: ${{ secrets.VITE_ESRI_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Records each deployment as a release, so the Releases page always shows the current site link.
  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish a release with the live link
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          TAG: deploy-${{ github.run_number }}
        run: |
          printf 'Live site: %s\n\nBuilt from commit %s on %s.\n' "$PAGE_URL" "$GITHUB_SHA" "$(date -u +%Y-%m-%d)" > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Offworld Atlas, deployment ${{ github.run_number }}" --notes-file notes.md --latest
